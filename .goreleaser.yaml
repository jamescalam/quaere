# GoReleaser config for quaere. Pure-Go (no cgo), so it cross-compiles for
# macOS and Linux from a single Linux runner, publishes a GitHub Release, and
# updates a Homebrew tap formula.
#
# Docs: https://goreleaser.com
version: 2

project_name: quaere

before:
  hooks:
    - go mod tidy

builds:
  - id: quaere
    main: .
    binary: quaere
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/aurelio-labs/quaere/internal/cmd.version={{ .Version }}

archives:
  - id: quaere
    ids:
      - quaere
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: quaere
    ids:
      - quaere
    # The binary(ies) inside the archive to link onto the PATH.
    binaries:
      - quaere
    repository:
      owner: aurelio-labs
      name: homebrew-quaere
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/aurelio-labs/quaere"
    description: "Terminal SQL client for PostgreSQL and Cloud SQL (IAM)"
    # The binary is unsigned, so strip the Gatekeeper quarantine flag on install
    # (casks have no default for this) — otherwise the first run is blocked as
    # coming from an "unidentified developer".
    hooks:
      post:
        install: |
          system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/quaere"]
